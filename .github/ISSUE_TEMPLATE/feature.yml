name: Feature request
description: Propose a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: "What do you need to see or do?" }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Proposal, description: "Remember the boundary: Vytrix is read-only and the collector has no dependencies." }
