name: Bug report
description: Something is wrong or confusing
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What you expected and what you saw. Never paste a token or a real process list you would not share." }
    validations: { required: true }
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Dashboard, Collector (agent/vytrix.py), Containers (Docker/Podman), macOS installer, Linux installer, deploy-remote.sh, Docs]
    validations: { required: true }
  - type: input
    id: platform
    attributes: { label: "OS and version", placeholder: "macOS 26.1 / Ubuntu 24.04" }
  - type: input
    id: version
    attributes: { label: "Vytrix version", placeholder: "0.2.0" }
