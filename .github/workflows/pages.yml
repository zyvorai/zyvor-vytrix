name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/ux/**"
      - "docs/social/**"
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "worker/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/build-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, mini]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Self-hosted runner: no hosted toolchain actions, so pin pnpm here.
      - run: |
          npm install --prefix "$RUNNER_TEMP/pnpm" pnpm@11.25.0
          echo "$RUNNER_TEMP/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      # Landing page + the real dashboard built static (simulated telemetry) under /demo/.
      # Same command locally: ./scripts/build-site.sh
      - run: ./scripts/build-site.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
