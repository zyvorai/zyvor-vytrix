name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/ux/**"
      - "docs/social/**"
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "worker/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/build-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Landing page + the real dashboard built static (simulated telemetry) under /demo/.
      # Same command locally: ./scripts/build-site.sh
      - run: ./scripts/build-site.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
