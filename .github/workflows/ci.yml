name: verify
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node tests/telemetry.mjs
      - run: node tests/cluster.mjs
      - run: python3 -m unittest discover -s tests -v
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-${{ matrix.os }}
          path: test-results/
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/test-containers.sh docker
      - run: scripts/test-containers.sh podman

  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y shellcheck
      - if: runner.os == 'macOS'
        run: brew install shellcheck
      - run: shellcheck scripts/install-macos.sh scripts/install-linux.sh scripts/deploy-remote.sh scripts/test-containers.sh scripts/build-site.sh
      - if: runner.os == 'macOS'
        run: scripts/install-macos.sh --dry-run --allow-origin http://localhost:5173
      - if: runner.os == 'Linux'
        run: |
          scripts/install-linux.sh --dry-run --allow-origin http://localhost:5173
          sudo scripts/install-linux.sh --dry-run --system --allow-origin https://dash.example.com
      - run: scripts/deploy-remote.sh 203.0.113.10 ci --dry-run

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Same commands locally: ./scripts/build-site.sh && node scripts/site-check.mjs
      # Builds the landing page and the real dashboard as static files, serves them under /zyvor-vytrix/ like Pages.
      - run: ./scripts/build-site.sh
      - run: node scripts/site-check.mjs --shots "$RUNNER_TEMP/site-shots"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: site-screenshots
          path: ${{ runner.temp }}/site-shots
          if-no-files-found: ignore
