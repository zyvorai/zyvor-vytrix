name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and upload
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: scripts/package-release.sh "${TAG#v}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            awk -v t="## $TAG" 'index($0,t)==1{f=1;next} /^## v/{f=0} f' CHANGELOG.md > notes.md
            gh release create "$TAG" release/* --title "$TAG" --notes-file notes.md
          fi

  # The native Mac app as a DMG and a pkg. Signed and notarized only when the Apple secrets exist:
  # MACOS_CERTS_P12 (base64 .p12 with the Developer ID Application and Installer identities),
  # MACOS_CERTS_PASSWORD, DEVELOPER_ID_APP, DEVELOPER_ID_INSTALLER, and an App Store Connect API key
  # for notarytool: NOTARY_KEY_P8 (base64), NOTARY_KEY_ID, NOTARY_ISSUER.
  mac:
    needs: release
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HAVE_CERTS: ${{ secrets.MACOS_CERTS_P12 != '' }}
      HAVE_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Import signing identities
        if: env.HAVE_CERTS == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTS_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 16)"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$kc" >/dev/null
          existing=()
          while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$kc" "${existing[@]}"
          rm "$RUNNER_TEMP/certs.p12"
      - name: Store notarytool credentials
        if: env.HAVE_CERTS == 'true' && env.HAVE_NOTARY == 'true'
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials vytrix-notary --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER" \
            --keychain "$RUNNER_TEMP/signing.keychain-db"
          rm "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_PROFILE=vytrix-notary" >> "$GITHUB_ENV"
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Package
        env:
          VYTRIX_WIDGETS: "1"
          DEVELOPER_ID_APP: ${{ env.HAVE_CERTS == 'true' && secrets.DEVELOPER_ID_APP || '' }}
          DEVELOPER_ID_INSTALLER: ${{ env.HAVE_CERTS == 'true' && secrets.DEVELOPER_ID_INSTALLER || '' }}
        run: scripts/package-mac.sh "${TAG#v}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/Vytrix-* --clobber

  # The MCP server image the Registry points at (server.json). Built on every tag with the other assets.
  mcp-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - run: scripts/check-version-sync.sh
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/zyvorai/vytrix-mcp
          tags: type=semver,pattern={{version}},value=${{ env.TAG }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

  # Registry metadata only: the image above is what clients pull. Tag pushes only.
  publish-mcp:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: mcp-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # GitHub OIDC login to the MCP Registry, no long-lived token
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher (pinned)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
