name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and upload
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: scripts/package-release.sh "${TAG#v}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            awk -v t="## $TAG" 'index($0,t)==1{f=1;next} /^## v/{f=0} f' CHANGELOG.md > notes.md
            gh release create "$TAG" release/* --title "$TAG" --notes-file notes.md
          fi

  # The native Mac app as a DMG and a pkg. Signed and notarized only when the Apple secrets exist:
  # MACOS_CERTS_P12 (base64 .p12 with the Developer ID Application and Installer identities),
  # MACOS_CERTS_PASSWORD, DEVELOPER_ID_APP, DEVELOPER_ID_INSTALLER, and an App Store Connect API key
  # for notarytool: NOTARY_KEY_P8 (base64), NOTARY_KEY_ID, NOTARY_ISSUER.
  mac:
    needs: release
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HAVE_CERTS: ${{ secrets.MACOS_CERTS_P12 != '' }}
      HAVE_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Import signing identities
        if: env.HAVE_CERTS == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTS_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -hex 16)"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$kc" >/dev/null
          existing=()
          while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$kc" "${existing[@]}"
          rm "$RUNNER_TEMP/certs.p12"
      - name: Store notarytool credentials
        if: env.HAVE_CERTS == 'true' && env.HAVE_NOTARY == 'true'
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials vytrix-notary --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER" \
            --keychain "$RUNNER_TEMP/signing.keychain-db"
          rm "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_PROFILE=vytrix-notary" >> "$GITHUB_ENV"
      - name: Package
        env:
          DEVELOPER_ID_APP: ${{ env.HAVE_CERTS == 'true' && secrets.DEVELOPER_ID_APP || '' }}
          DEVELOPER_ID_INSTALLER: ${{ env.HAVE_CERTS == 'true' && secrets.DEVELOPER_ID_INSTALLER || '' }}
        run: scripts/package-mac.sh "${TAG#v}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/Vytrix-* --clobber
