<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Vytrix share card</title>
<style>
:root{--bg:#07080d;--line:rgba(255,255,255,.12);--text:#f5f5f7;--dim:#a1a1a6;--orange:#f56a21}
*{box-sizing:border-box}html,body{margin:0}
body{width:1600px;height:900px;overflow:hidden;position:relative;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;text-align:center}
.glow{position:absolute;inset:0;background:radial-gradient(900px 420px at 50% -6%,rgba(245,106,33,.32),transparent 70%),radial-gradient(700px 400px at 100% 100%,rgba(41,151,255,.2),transparent 70%)}
.top{position:absolute;left:0;right:0;top:58px}
.brand{display:inline-flex;align-items:center;gap:18px;font-size:30px;font-weight:650;letter-spacing:.24em}
.brand svg{width:64px;height:64px;border-radius:16px}
h1{margin:22px 0 0;font-size:84px;line-height:1.04;letter-spacing:-.04em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--orange),#ffb36b);-webkit-background-clip:text;color:transparent}
p{margin:16px auto 0;font-size:30px;color:var(--dim);max-width:1100px}
.shot{position:absolute;left:50%;top:470px;width:1080px;margin-left:-540px;border-radius:22px;border:1px solid rgba(255,255,255,.16);box-shadow:0 40px 100px -10px rgba(0,0,0,.8)}
</style></head><body><div class="glow"></div>
<div class="top"><div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1d1d1f"/><path d="M5 18h5l3-9 5 16 3-7h6" fill="none" stroke="#f56a21" stroke-width="2.5" stroke-linejoin="round"/></svg>VYTRIX</div>
<h1>See what your machine is <em>really doing.</em></h1>
<p>Read-only system monitor for macOS and Linux. Apps, ports, containers.</p></div>
<img class="shot" src="../ux/glass-dark-overview.png" alt="">
</body></html>
