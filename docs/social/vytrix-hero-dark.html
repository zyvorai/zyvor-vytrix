<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Vytrix hero</title>
<style>
:root{--bg:#07080d;--line:rgba(255,255,255,.12);--text:#f5f5f7;--dim:#a1a1a6;--orange:#f56a21;--blue:#2997ff}
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
.glow{position:absolute;inset:0;background:radial-gradient(700px 380px at 6% -8%,rgba(245,106,33,.30),transparent 70%),radial-gradient(700px 420px at 100% 100%,rgba(41,151,255,.22),transparent 70%),radial-gradient(420px 300px at 60% 0%,rgba(142,92,246,.16),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;opacity:.14;mask-image:linear-gradient(90deg,#000,transparent 70%)}
.copy{position:absolute;left:64px;top:52px;width:500px;bottom:48px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:650;letter-spacing:.2em}
.brand svg{width:46px;height:46px;border-radius:12px;box-shadow:0 6px 20px rgba(245,106,33,.35)}
h1{margin:34px 0 0;font-size:60px;line-height:1.03;letter-spacing:-.035em;font-weight:700}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--orange),#ffb36b);-webkit-background-clip:text;color:transparent}
p.sub{margin:20px 0 0;font-size:22px;line-height:1.38;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:auto}
.chips span{font-size:16px;font-weight:600;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.chips .ro{color:#30d158;border-color:rgba(48,209,88,.45);background:rgba(48,209,88,.12)}
.foot{margin-top:14px;font-size:15px;color:var(--dim);letter-spacing:.03em}
.shot{position:absolute;border-radius:16px;border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 80px -10px rgba(0,0,0,.7),0 0 0 .5px rgba(0,0,0,.6)}
.s1{left:552px;top:70px;width:720px}
.s2{left:610px;top:392px;width:470px;border-radius:14px;box-shadow:0 30px 70px -10px rgba(0,0,0,.75)}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="copy">
  <div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#1d1d1f"/><path d="M5 18h5l3-9 5 16 3-7h6" fill="none" stroke="#f56a21" stroke-width="2.5" stroke-linejoin="round"/></svg>VYTRIX</div>
  <h1>See what your machine is <em>really doing.</em></h1>
  <p class="sub">A read-only system monitor for macOS and Linux. Apps, processes, ports, and Docker and Podman containers, in Liquid Glass or Adwaita.</p>
  <div class="chips"><span class="ro">Read-only</span><span>macOS 26</span><span>Linux</span><span>Docker</span><span>Podman</span></div>
  <div class="foot">Dependency-free collector · Local-first · BUSL-1.1</div>
</div>
<img class="shot s1" src="../ux/glass-dark-overview.png" alt="">
<img class="shot s2" src="../ux/adwaita-light-containers.png" alt="">
</body></html>
